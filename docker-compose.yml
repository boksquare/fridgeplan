# Deploying pulls a prebuilt image rather than building on the box:
#
#   docker compose pull && docker compose up -d
#
# Images are published to GHCR by .github/workflows/publish.yml. To build from
# your own working copy instead, add the build override:
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up --build

services:
  app:
    # Override either half in .env: FRIDGEPLAN_IMAGE to run your own fork's
    # image, FRIDGEPLAN_TAG to pin a release (e.g. v1.2.0) instead of tracking
    # latest.
    image: ${FRIDGEPLAN_IMAGE:-ghcr.io/boksquare/fridgeplan}:${FRIDGEPLAN_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://fridgeplan:${POSTGRES_PASSWORD:-fridgeplan}@db:5432/fridgeplan?schema=public
      # Quoted: the ":?" message contains ": ", which makes an unquoted YAML
      # scalar ambiguous and stops the whole file parsing.
      AUTH_SECRET: "${AUTH_SECRET:?set AUTH_SECRET in .env - generate one with `openssl rand -base64 32`}"
      AUTH_TRUST_HOST: "true"
      # Empty by default, and that is the right default: AUTH_TRUST_HOST above
      # makes Auth.js take the origin from the incoming request, which is
      # correct behind any proxy. This used to default to http://localhost:3000,
      # which is a real URL for nobody but a local developer — and Auth.js
      # resolves its redirects against it, so signing out sent everyone to a
      # host that did not exist for them. Set it only if the app cannot see its
      # own public host in the request headers.
      NEXTAUTH_URL: ${NEXTAUTH_URL:-}
      UPLOAD_DIR: /app/uploads
      # Optional: recipe sources and the AI provider. See .env.example.
      SPOONACULAR_API_KEY: ${SPOONACULAR_API_KEY:-}
      RECIPE_PROVIDERS: ${RECIPE_PROVIDERS:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_ENCRYPTION_KEY: ${AI_ENCRYPTION_KEY:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      # Photos uploaded with private recipes (Phase 2).
      - uploads:/app/uploads

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fridgeplan
      POSTGRES_USER: fridgeplan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fridgeplan}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fridgeplan -d fridgeplan"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  uploads:
